services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: taskflow-postgres:17
    container_name: taskflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - taskflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  backend:
    build: .
    container_name: taskflow-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8081'"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - taskflow-net

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskflow-net

  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./supabase/migrations/20260915120000_harden_runtime.sql:/migration.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migration.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskflow-net

volumes:
  taskflow_data:

networks:
  taskflow-net:
    driver: bridge
