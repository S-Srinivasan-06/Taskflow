# Activate with SPRING_PROFILES_ACTIVE=supabase.
# Use the Session pooler (port 5432) or a direct connection; Hibernate is not
# compatible with Supabase's transaction pooler on port 6543.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep application-owned tables outside schemas exposed by the Supabase Data API.
spring.jpa.properties.hibernate.default_schema=${SUPABASE_DB_SCHEMA:app}

# Supabase migrations own the remote schema. Hibernate should detect drift, not
# silently change production tables at application startup.
spring.jpa.hibernate.ddl-auto=validate
app.cookie-secure=${APP_COOKIE_SECURE:true}
app.required-schema-version=3

# Use a conservative application-side pool when connecting through Supavisor.
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SUPABASE_DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${SUPABASE_DB_CONNECTION_TIMEOUT_MS:30000}
