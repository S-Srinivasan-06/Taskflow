# Server Configuration
server.port=${PORT:8081}
server.tomcat.max-http-post-size=1048576
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,schema
app.max-tasks-per-user=${APP_MAX_TASKS_PER_USER:2000}
logging.pattern.level=%5p [request:%X{requestId:-none}]

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Pagination — hard cap enforced at framework level
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=10

# Jackson Configuration (Crucial for OffsetDateTime)
spring.jackson.serialization.write-dates-as-timestamps=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
