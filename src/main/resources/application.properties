# Server Configuration
server.port=8081
server.tomcat.max-http-post-size=1048576

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Pagination — hard cap enforced at framework level
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=10

# Jackson Configuration (Crucial for OffsetDateTime)
spring.jackson.serialization.write-dates-as-timestamps=false

# Redis / Cache Configuration
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
